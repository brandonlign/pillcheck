<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PillCheck · design directions</title>
<link rel="stylesheet" href="../public/fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: #d9d9de; font-family: -apple-system, "Segoe UI", system-ui, sans-serif; padding: 28px; }
  .row { display: flex; gap: 34px; justify-content: center; align-items: flex-start; flex-wrap: wrap; }
  .col { display: grid; gap: 12px; justify-items: center; }
  .col h2 { font: 800 15px system-ui; letter-spacing: .02em; color: #111; }
  .col p.tag { font: 500 12px system-ui; color: #555; max-width: 340px; text-align: center; }
  .phone { position: relative; width: 340px; height: 720px; border-radius: 44px; overflow: hidden; box-shadow: 0 0 0 9px #111, 0 30px 60px -20px rgb(0 0 0 / .5); }
  .status { height: 40px; display: flex; justify-content: space-between; align-items: center; padding: 0 26px; font: 700 13px system-ui; }
  .tabs { position: absolute; left: 0; right: 0; bottom: 0; height: 78px; display: flex; justify-content: space-around; align-items: flex-start; padding-top: 10px; font: 600 10px system-ui; }
  .tabs span { display: grid; justify-items: center; gap: 3px; }
  .tabs i { width: 22px; height: 22px; border-radius: 6px; display: block; }
  svg.p { display: block; }

  /* ---------- A: Clinical calm (Apple Health) ---------- */
  .A { background: #f2f2f7; color: #000; font-family: -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif; }
  .A .wrap { padding: 6px 18px; }
  .A .date { color: #8e8e93; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .02em; margin-top: 8px; }
  .A h1 { font-size: 34px; font-weight: 800; letter-spacing: -.02em; margin-bottom: 14px; }
  .A .card { background: #fff; border-radius: 14px; }
  .A .due { padding: 16px; }
  .A .due small { color: #ff9500; font-weight: 700; font-size: 13px; }
  .A .due h3 { font-size: 20px; font-weight: 700; margin: 2px 0 12px; }
  .A .pills { display: flex; gap: 10px; margin-bottom: 14px; }
  .A .pills > div { display: flex; align-items: center; gap: 8px; background: #f2f2f7; border-radius: 10px; padding: 6px 10px 6px 4px; font-size: 13px; font-weight: 600; }
  .A .btn { display: block; text-align: center; background: #007aff; color: #fff; border-radius: 12px; padding: 14px; font-weight: 600; font-size: 16px; }
  .A .link { display: block; text-align: center; color: #007aff; font-size: 14px; margin-top: 10px; }
  .A .sec { color: #8e8e93; font-size: 13px; text-transform: uppercase; margin: 22px 16px 6px; }
  .A .li { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: .5px solid #e5e5ea; }
  .A .li:first-child { border-top: 0; }
  .A .li b { display: block; font-size: 16px; font-weight: 600; }
  .A .li span.s { font-size: 13px; color: #8e8e93; }
  .A .st { margin-left: auto; font-size: 13px; font-weight: 600; }
  .A .tabs { background: rgb(249 249 249 / .94); border-top: .5px solid #d1d1d6; color: #8e8e93; }
  .A .tabs .on { color: #007aff; }
  .A .tabs i { background: currentColor; opacity: .85; border-radius: 6px; }
  .A .photo { height: 230px; background: #000; display: grid; place-items: center; }
  .A .verdict { display: flex; gap: 12px; align-items: center; padding: 16px; }
  .A .ok { width: 40px; height: 40px; border-radius: 50%; background: #34c759; color: #fff; display: grid; place-items: center; font-size: 22px; font-weight: 800; flex-shrink: 0; }
  .A .verdict b { font-size: 20px; }
  .A .verdict span { color: #8e8e93; font-size: 14px; display: block; }

  /* ---------- B: Bold minimal (Things / Linear) ---------- */
  .B { background: #fff; color: #0a0a0a; font-family: "DM Sans", system-ui, sans-serif; }
  .B .wrap { padding: 8px 24px; }
  .B .date { font-size: 13px; font-weight: 600; color: #8a8a8a; margin-top: 14px; }
  .B .big { font-family: "Manrope", system-ui; font-weight: 800; font-size: 76px; letter-spacing: -.05em; line-height: .95; margin-top: 10px; }
  .B .big small { font-size: 34px; color: #b5b5b5; }
  .B .lbl { font-size: 15px; color: #6b6b6b; margin-top: 6px; }
  .B .bar { display: flex; gap: 6px; margin: 22px 0 30px; }
  .B .bar i { flex: 1; height: 6px; border-radius: 4px; background: #ececec; }
  .B .bar i.on { background: #0a0a0a; }
  .B .bar i.due { background: #ff5b2e; }
  .B .t { display: grid; grid-template-columns: 62px 1fr auto; gap: 4px 12px; padding: 16px 0; border-top: 1px solid #efefef; align-items: center; }
  .B .t .h { font-size: 13px; font-weight: 700; color: #8a8a8a; }
  .B .t b { font-size: 17px; font-weight: 700; }
  .B .t span.m { grid-column: 2; font-size: 14px; color: #6b6b6b; }
  .B .t .chip { grid-row: 1 / 3; grid-column: 3; font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 999px; }
  .B .chip.done { background: #f1f1f1; color: #6b6b6b; }
  .B .chip.go { background: #ff5b2e; color: #fff; }
  .B .t.dim b, .B .t.dim .m { color: #b5b5b5; text-decoration: line-through; }
  .B .fab { position: absolute; left: 50%; transform: translateX(-50%); bottom: 96px; background: #0a0a0a; color: #fff; border-radius: 999px; padding: 16px 28px; font-weight: 700; font-size: 16px; white-space: nowrap; box-shadow: 0 12px 30px -10px rgb(0 0 0 / .5); }
  .B .tabs { background: #fff; border-top: 1px solid #efefef; color: #b5b5b5; }
  .B .tabs .on { color: #0a0a0a; }
  .B .tabs i { background: currentColor; border-radius: 50%; width: 8px; height: 8px; margin-top: 8px; }
  .B .photo { height: 360px; background: #111; display: grid; place-items: center; }
  .B .sheet { position: absolute; left: 0; right: 0; top: 330px; bottom: 78px; background: #fff; border-radius: 26px 26px 0 0; padding: 26px 24px; }
  .B .sheet .big { font-size: 58px; }
  .B .sheet .row2 { display: flex; gap: 10px; margin: 18px 0 22px; }
  .B .sheet .row2 > div { flex: 1; border: 1px solid #efefef; border-radius: 16px; padding: 10px; display: grid; justify-items: center; font-size: 13px; font-weight: 700; gap: 2px; }
  .B .solid { display: block; text-align: center; background: #0a0a0a; color: #fff; border-radius: 999px; padding: 16px; font-weight: 700; }

  /* ---------- C: Warm & friendly (Headspace / Gentler Streak) ---------- */
  .C { background: #fbf6ef; color: #2b2118; font-family: "Manrope", system-ui, sans-serif; }
  .C .wrap { padding: 6px 20px; }
  .C .hi { font-size: 15px; font-weight: 600; color: #8c7a6a; margin-top: 12px; }
  .C h1 { font-size: 28px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; margin: 2px 0 16px; }
  .C .hero { background: #ffe4d1; border-radius: 28px; padding: 20px; position: relative; overflow: hidden; }
  .C .hero small { font-weight: 800; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #c2410c; }
  .C .hero h3 { font-size: 22px; font-weight: 800; margin: 4px 0 2px; }
  .C .hero p { font-size: 14px; color: #7a5a44; }
  .C .hero .art { position: absolute; right: -6px; top: 12px; display: flex; }
  .C .btn { display: block; text-align: center; background: #e8590c; color: #fff; border-radius: 18px; padding: 15px; font-weight: 800; margin-top: 18px; box-shadow: 0 4px 0 #b8460a; }
  .C .dots { display: flex; gap: 10px; margin: 20px 0 8px; }
  .C .dots > div { flex: 1; background: #fff; border-radius: 20px; padding: 12px; display: grid; gap: 4px; }
  .C .dots b { font-size: 14px; }
  .C .dots span { font-size: 12px; color: #8c7a6a; font-weight: 600; }
  .C .dots .ok { color: #15803d; }
  .C .dots .now { color: #c2410c; }
  .C .tabs { background: #fbf6ef; color: #c0ad9b; }
  .C .tabs .on { color: #e8590c; }
  .C .tabs i { background: currentColor; border-radius: 8px; }
  .C .photo { height: 250px; background: #2b2118; border-radius: 28px; margin: 6px 20px 0; display: grid; place-items: center; }
  .C .res { margin: 16px 20px 0; background: #dcfce7; border-radius: 28px; padding: 20px; text-align: center; }
  .C .res .ok { width: 56px; height: 56px; border-radius: 50%; background: #16a34a; color: #fff; display: grid; place-items: center; margin: 0 auto 8px; font-size: 30px; font-weight: 800; }
  .C .res h3 { font-size: 24px; font-weight: 800; }
  .C .res p { color: #3f6b4b; font-size: 14px; margin-top: 2px; }
  .C .res .pp { display: flex; justify-content: center; gap: 8px; margin-top: 12px; }
</style>
</head>
<body>
<div class="row" id="today"></div>
<div class="row" id="scan" style="margin-top:40px"></div>
<script>
const shade = (hex, amt) => "#" + [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16)).map((v) => Math.round(amt >= 0 ? v + (255 - v) * amt : v * (1 + amt))).map((v) => v.toString(16).padStart(2, "0")).join("");
let n = 0;
function pill(shape, c, size = 34, angle = -32) {
  const id = "p" + ++n, hi = shade(c, .55), lo = shade(c, -.28), rim = shade(c, -.42);
  const defs = `<defs><radialGradient id="${id}b" cx="35%" cy="28%" r="80%"><stop offset="0" stop-color="${hi}"/><stop offset=".55" stop-color="${c}"/><stop offset="1" stop-color="${lo}"/></radialGradient><linearGradient id="${id}c" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${lo}"/><stop offset=".18" stop-color="${hi}"/><stop offset=".45" stop-color="${c}"/><stop offset="1" stop-color="${rim}"/></linearGradient><linearGradient id="${id}w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9d6cf"/><stop offset=".18" stop-color="#fff"/><stop offset=".45" stop-color="#f4f2ee"/><stop offset="1" stop-color="#b9b5ad"/></linearGradient></defs>`;
  const body = shape === "cap"
    ? `<g transform="rotate(${angle} 32 32)"><rect x="8" y="22" width="48" height="20" rx="10" fill="url(#${id}w)"/><path d="M32 22H18a10 10 0 0 0 0 20h14z" fill="url(#${id}c)"/><rect x="13" y="25.5" width="36" height="3.4" rx="1.7" fill="#fff" opacity=".7"/></g>`
    : `<circle cx="32" cy="32" r="21" fill="url(#${id}b)"/><circle cx="32" cy="32" r="21" fill="none" stroke="${rim}" stroke-opacity=".5"/><path d="M13 32h38" stroke="${rim}" stroke-opacity=".45" stroke-width="1.4"/><ellipse cx="24" cy="22.5" rx="7" ry="3.2" fill="#fff" opacity=".7" transform="rotate(-24 24 22.5)"/>`;
  return `<svg class="p" width="${size}" height="${size}" viewBox="0 0 64 64">${defs}${body}</svg>`;
}
const P1 = (s) => pill("cap", "#f59f5a", s), P2 = (s) => pill("round", "#78a9ec", s), P3 = (s) => pill("round", "#f4a6b7", s);
const status = `<div class="status"><span>5:42</span><span>●●● ▮</span></div>`;
const tabs = (on, a, b, c, d) => `<div class="tabs">${[a, b, c, d].map((t, i) => `<span class="${i === on ? "on" : ""}"><i></i>${t}</span>`).join("")}</div>`;
const photo = `<div style="display:flex;gap:60px">${P1(90)}${P2(76)}</div>`;

const A_today = `<div class="phone A">${status}<div class="wrap"><div class="date">Sunday, October 25</div><h1>Today</h1>
<div class="card due"><small>DUE NOW</small><h3>Morning dose</h3><div class="pills"><div>${P1(30)}Pancrelipase</div><div>${P2(30)}Lovastatin</div></div><div class="btn">Scan to check</div><div class="link">Log without scanning</div></div>
<div class="sec">Schedule</div><div class="card"><div class="li">${P1(30)}<div><b>Morning</b><span class="s">8:00 AM · 2 pills</span></div><span class="st" style="color:#ff9500">Due</span></div><div class="li">${P3(30)}<div><b>Evening</b><span class="s">6:00 PM · 1 pill</span></div><span class="st" style="color:#8e8e93">Later</span></div></div>
<div class="sec">This week</div><div class="card" style="padding:14px 16px;display:flex;justify-content:space-between;font-size:14px"><span><b style="font-size:22px">85%</b> taken</span><span style="color:#ff9500;font-weight:600">2-day streak</span></div>
</div>${tabs(0, "Today", "Medications", "History", "Settings")}</div>`;
const A_scan = `<div class="phone A">${status}<div class="photo">${photo}</div><div class="wrap" style="padding-top:14px"><div class="card"><div class="verdict"><div class="ok">✓</div><div><b>Matches your plan</b><span>2 of 2 pills recognized</span></div></div><div class="li">${P1(30)}<div><b>Pancrelipase</b><span class="s">Lipase 5,000 units</span></div><span class="st" style="color:#34c759">✓</span></div><div class="li">${P2(30)}<div><b>Lovastatin</b><span class="s">20 mg</span></div><span class="st" style="color:#34c759">✓</span></div></div><div class="btn" style="margin-top:16px;background:#34c759">Log morning dose</div><div class="link">Retake photo</div></div>${tabs(0, "Today", "Medications", "History", "Settings")}</div>`;

const B_today = `<div class="phone B">${status}<div class="wrap"><div class="date">Sunday, Oct 25</div><div class="big">0<small>/3</small></div><div class="lbl">doses taken today</div><div class="bar"><i class="due"></i><i class="due"></i><i></i></div>
<div class="t"><span class="h">8:00</span><b>Morning</b><span class="m">Pancrelipase, Lovastatin</span><span class="chip go">Scan</span></div>
<div class="t"><span class="h">18:00</span><b>Evening</b><span class="m">Metoprolol</span><span class="chip done">Later</span></div>
<div class="t dim" style="border-bottom:1px solid #efefef"><span class="h">Yest.</span><b>All 3 doses</b><span class="m">Logged</span><span class="chip done">✓</span></div>
</div><div class="fab">Scan a dose</div>${tabs(0, "Today", "Meds", "History", "Settings")}</div>`;
const B_scan = `<div class="phone B">${status}<div class="photo">${photo}</div><div class="sheet"><div class="lbl" style="margin:0">Morning dose</div><div class="big">Match.</div><div class="row2"><div>${P1(40)}Pancrelipase</div><div>${P2(40)}Lovastatin</div></div><div class="solid">Log dose</div><div style="text-align:center;margin-top:14px;font-weight:700;color:#8a8a8a">Retake</div></div>${tabs(0, "Today", "Meds", "History", "Settings")}</div>`;

const C_today = `<div class="phone C">${status}<div class="wrap"><div class="hi">Good evening, Demo</div><h1>Time for your<br>morning pills</h1>
<div class="hero"><small>Due now</small><h3>2 pills</h3><p>Pancrelipase · Lovastatin</p><div class="art">${P1(64)}${P2(56)}</div><div class="btn">Check with camera</div></div>
<div class="dots"><div><b class="now">Morning</b><span>Due now</span></div><div><b>Evening</b><span>6:00 PM</span></div><div><b class="ok">Streak</b><span>2 days</span></div></div>
</div>${tabs(0, "Today", "Pills", "History", "Me")}</div>`;
const C_scan = `<div class="phone C">${status}<div class="photo">${photo}</div><div class="res"><div class="ok">✓</div><h3>All good!</h3><p>Both pills match your morning plan.</p><div class="pp">${P1(46)}${P2(40)}</div></div><div class="wrap"><div class="btn">I took them</div><div style="text-align:center;margin-top:12px;font-weight:700;color:#8c7a6a">Retake photo</div></div>${tabs(0, "Today", "Pills", "History", "Me")}</div>`;

const col = (title, tag, html) => `<div class="col"><h2>${title}</h2><p class="tag">${tag}</p>${html}</div>`;
document.getElementById("today").innerHTML =
  col("A · Clinical calm", "Like Apple Health. Native, quiet, list-based. Trustworthy, very easy to scan.", A_today) +
  col("B · Bold minimal", "Like Things 3 / Linear. Big numbers, black & one accent, almost no chrome.", B_today) +
  col("C · Warm & friendly", "Like Headspace / Gentler Streak. Cream, rounded, one warm color, chatty.", C_today);
document.getElementById("scan").innerHTML = col("A · result", "", A_scan) + col("B · result", "", B_scan) + col("C · result", "", C_scan);
</script>
</body>
</html>
